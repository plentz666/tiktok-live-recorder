name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Apps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install pytz -r requirements.txt || pip install pytz

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Tes ranngusion__ (Metode Manual Jeda)
        run: |
          # Jalankan skrip rekam di latar belakang (background)
          python main.py -user ranngusion__ -mode manual &
          # Simpan ID prosesnya (PID)
          PID=$!
          echo "Rekaman dimulai dengan PID $PID"
          # Jeda selama 2 menit (120 detik) untuk perekaman
          sleep 120
          # Kirim sinyal pemberhentian (lebih halus dari kill)
          # Cobalah agar skrip menangani sinyal ini untuk menyimpan file
          kill $PID
          # Beri jeda 10 detik lagi agar proses penyimpanan selesai
          sleep 10
          # Paksa mati jika masih hidup setelah 10 detik
          kill -9 $PID 2>/dev/null || true
          echo "Rekaman dihentikan."

      - name: Cek File Video Terbentuk
        run: ls -la *.mp4 2>/dev/null || echo "Tidak ada file mp4 ditemukan."

      - name: Upload GDrive
        if: always()
        run: rclone copy ./ gdrive:TikTok_Replays --include "*.mp4" --progress
