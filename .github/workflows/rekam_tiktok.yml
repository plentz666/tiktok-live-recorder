name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends ffmpeg rclone > /dev/null 2>&1
          pip install --no-cache-dir pytz -r requirements.txt > /dev/null 2>&1 || pip install --no-cache-dir pytz

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" > ~/.config/rclone/rclone.conf

      - name: Rekam Akun 1
        run: python main.py -user nnaaheni -mode express

      - name: Rekam Akun 2
        run: python main.py -user nanaaheni_ -mode express

      - name: Upload GDrive
        if: always()
        run: rclone copy ./ gdrive:TikTok_Replays --include "*.mp4" --progress
