name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Apps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install pytz -r requirements.txt || pip install pytz

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Tes 2 Menit
        run: |
          python main.py -user ranngusion__ -mode manual &
          PID=$!
          sleep 120
          kill -2 $PID || kill $PID
          sleep 5

      - name: Cari & Upload Semua File MP4
        if: always()
        run: |
          echo "Mencari semua file mp4:"
          find . -name "*.mp4"
          rclone copy ./ gdrive:TikTok_Replays --include "**/*.mp4" --progress
