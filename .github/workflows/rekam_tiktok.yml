name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install pytz -r requirements.txt || pip install pytz

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Jalankan Rekam 1 Menit & Debug
        continue-on-error: true
        run: |
          # Jalankan python di background selama 60 detik
          python main.py -user ranngusion__ -mode manual &
          PID=$!
          sleep 60
          kill -2 $PID || true
          sleep 5

      - name: Cek Folder Lokal & Upload ke GDrive
        if: always()
        run: |
          echo "Daftar file di direktori saat ini:"
          ls -la
          echo "Mencari file video secara mendalam:"
          find . -name "*.mp4"
          rclone copy ./ gdrive:TikTok_Replays --include "**/*.mp4" --progress
