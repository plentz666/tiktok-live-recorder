name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Buat Video Tes (FFmpeg 5 Detik)
        run: |
          ffmpeg -f lavfi -i testsrc=duration=5:size=1280x720:rate=30 tes_video.mp4

      - name: Upload GDrive
        run: |
          rclone copy tes_video.mp4 gdrive:TikTok_Replays --progress
