name: 🔴 Rekam Full Live TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live nanaaheni_ (Direct FFmpeg Reconnect)
        continue-on-error: true
        run: |
          STREAM_URL=$(yt-dlp -g "https://www.tiktok.com/@nanaaheni_/live" 2>/dev/null || true)
          if [ -n "$STREAM_URL" ]; then
            ffmpeg -y \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -err_detect ignore_err \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              -i "$STREAM_URL" \
              -c copy -movflags +faststart "rekaman_nanaaheni_$(date +'%Y%m%d_%H%M%S').mp4" || true
          fi

      - name: Rekam Live ranngusion__ (Direct FFmpeg Reconnect)
        continue-on-error: true
        run: |
          STREAM_URL=$(yt-dlp -g "https://www.tiktok.com/@ranngusion__/live" 2>/dev/null || true)
          if [ -n "$STREAM_URL" ]; then
            ffmpeg -y \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -err_detect ignore_err \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              -i "$STREAM_URL" \
              -c copy -movflags +faststart "rekaman_ranngusion__$(date +'%Y%m%d_%H%M%S').mp4" || true
          fi

      - name: Upload ke GDrive
        if: always()
        run: |
          mkdir -p build_output
          mv rekaman_*.mp4 build_output/ 2>/dev/null || true
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          fi
