name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Streamlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live TikTok (Streamlink 1 Menit)
        continue-on-error: true
        run: |
          timeout 60s streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                 "https://www.tiktok.com/@ranngusion__/live" best \
                 -o "rekaman_ranngusion.mp4" --force || true

      - name: Cek & Upload ke GDrive
        if: always()
        run: |
          ls -la
          rclone copy rekaman_ranngusion.mp4 gdrive:TikTok_Replays --progress
