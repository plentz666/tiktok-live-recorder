name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Streamlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live nanaaheni_
        continue-on-error: true
        run: |
          streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                     "https://www.tiktok.com/@nanaaheni_/live" best \
                     -o "rekaman_nanaaheni_$(date +'%Y%m%d_%H%M%S').mp4" --force || true

      - name: Rekam Live nnaaheni
        continue-on-error: true
        run: |
          streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                     "https://www.tiktok.com/@nnaaheni/live" best \
                     -o "rekaman_nnaaheni_$(date +'%Y%m%d_%H%M%S').mp4" --force || true

      - name: Upload ke GDrive
        if: always()
        run: |
          rclone copy ./ gdrive:TikTok_Replays --include "*.mp4" --progress
