name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Apps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install pytz -r requirements.txt || pip install pytz

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Akun 1
        run: python main.py -user nnaaheni -mode manual -duration 1 || true

      - name: Rekam Akun 2
        run: python main.py -user nanaaheni_ -mode manual -duration 1 || true

      - name: Upload GDrive
        if: always()
        run: rclone copy ./ gdrive:TikTok_Replays --include "*.mp4" --progress
