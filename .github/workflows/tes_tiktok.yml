name: 🔴 Rekam Tes TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yt-dlp & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live ranngusion__ Pas 5 Menit
        run: |
          mkdir -p build_output
          echo "Mulai merekam live..."
          
          # 1. Rekam live tanpa timeout mentah yang bikin korup (biarkan rekam agak lamaan dikit, misal 330 detik)
          yt-dlp --hls-use-mpegts --downloader ffmpeg --downloader-args "ffmpeg_i:-t 330" "https://www.tiktok.com/@ranngusion__/live" -o "video_mentah.mp4" || true

          # 2. Potong dan rapikan durasinya pas 5 menit (300 detik) menggunakan FFmpeg secara presisi tinggi
          if [ -f "video_mentah.mp4" ]; then
            echo "Memotong dan merapikan durasi video ke GDrive..."
            ffmpeg -y -i video_mentah.mp4 -t 300 -c copy -movflags +faststart "build_output/rekaman_ranngusion___$(date +'%Y%m%d_%H%M%S').mp4"
            rm video_mentah.mp4
          fi

      - name: Upload ke GDrive
        if: always()
        run: |
          find build_output/ -type f -size -1M -delete 2>/dev/null || true
          
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            echo "Mengupload file ke GDrive..."
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          else
            echo "❌ GAGAL: Tidak ada file valid yang diupload."
          fi
