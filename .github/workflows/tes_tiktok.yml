name: 🧪 Tes Live TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools & yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python3 -m pip install --upgrade pip
          pip install --upgrade yt-dlp streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live betrixstelar (10 Menit via yt-dlp)
        run: |
          mkdir -p temp_record
          OUT_TS="temp_record/raw.ts"
          echo "Memulai perekaman betrixstelar menggunakan yt-dlp..."

          # Gunakan yt-dlp dengan timeout internal 600 detik (10 menit)
          yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
                 --referer "https://www.tiktok.com/" \
                 --downloader ffmpeg \
                 --downloader-args "ffmpeg:-t 600" \
                 "https://www.tiktok.com/@betrixstelar/live" \
                 -o "$OUT_TS" || true

      - name: Remux ke MP4 Valid
        run: |
          mkdir -p build_output
          OUT_FILE="build_output/rekaman_betrixstelar_$(date +'%Y%m%d_%H%M%S').mp4"

          if [ -f "temp_record/raw.ts" ] && [ $(stat -c%s "temp_record/raw.ts" 2>/dev/null || echo 0) -gt 2000000 ]; then
            echo "File mentah ditemukan (>2MB). Meremux ke MP4..."
            ffmpeg -y -i temp_record/raw.ts -c copy -bsf:a aac_adtstoasc -movflags +faststart "$OUT_FILE" || true
            rm -rf temp_record
          else
            echo "❌ PEREKAMAN GAGAL: File kosong atau terlalu kecil. Tidak ada file yang diproses."
            rm -rf temp_record
          fi

      - name: Upload ke GDrive (Hanya Jika Ada File MP4 Valid)
        run: |
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            echo "Mengunggah file MP4 ke Google Drive..."
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          else
            echo "Batal upload ke GDrive karena tidak ada file MP4 valid."
          fi
