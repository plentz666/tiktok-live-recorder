name: Rekam Cloud TikTok (480p)

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Streamlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live TikTok (Streamlink 1 Menit)
        continue-on-error: true
        run: |
          timeout 60s streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                 "https://www.tiktok.com/@argus.bkent/live" best \
                 -o "raw_video.flv" --force || true

      - name: Compress ke 480p & Convert ke MP4 Playable GDrive
        run: |
          if [ -f "raw_video.flv" ] && [ -s "raw_video.flv" ]; then
            ffmpeg -y -i raw_video.flv \
                   -vf "scale=-2:480" \
                   -c:v libx264 -crf 28 -preset superfast \
                   -c:a aac -b:a 96k \
                   -movflags +faststart \
                   rekaman_argus.mp4 || true
            rm -f raw_video.flv
          fi

      - name: Cek & Upload ke GDrive
        if: always()
        run: |
          ls -la
          if [ -f "rekaman_argus.mp4" ]; then
            rclone copy rekaman_argus.mp4 gdrive:TikTok_Replays --progress
          fi
