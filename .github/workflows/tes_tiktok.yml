name: 🔴 Rekam Tes TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Streamlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install --upgrade streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live cipuyyy221 (Fix Durasi & Anti Black Screen)
        continue-on-error: true
        run: |
          mkdir -p parts_cipuyyy
          echo "Memulai perekaman cipuyyy221 maksimal 5 menit..."
          START_TIME=$(date +%s)

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))
            if [ $ELAPSED -ge 300 ]; then
              echo "Batas waktu 5 menit tercapai."
              break
            fi
            REMAINING=$((300 - ELAPSED))
            
            # File disimpan dengan format .ts agar anti-corrupt
            FILE_OUT="parts_cipuyyy/part_${NOW}.ts"

            timeout ${REMAINING}s streamlink --quiet --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
                       --http-header "Referer=https://www.tiktok.com/" \
                       "https://www.tiktok.com/@cipuyyy221/live" best -o "$FILE_OUT" || true

            sleep 3
          done

          # BAGIAN YANG DIPERBAIKI: Gabungkan file dan reset durasi videonya ke 0
          if [ "$(ls -A parts_cipuyyy 2>/dev/null)" ]; then
            echo "Menggabungkan video dan mereset durasi..."
            # 1. Gabungin semua potongan video .ts jadi satu file utuh bernama gabungan.ts
            cat parts_cipuyyy/*.ts > gabungan.ts
            
            # 2. Convert ke MP4 dan paksa perbaiki waktu video yang ngaco pakai -fflags +genpts
            ffmpeg -y -fflags +genpts -i gabungan.ts -c copy -bsf:a aac_adtstoasc -movflags +faststart "rekaman_cipuyyy221_$(date +'%Y%m%d_%H%M%S').mp4"
            
            # 3. Hapus file sementara
            rm gabungan.ts
          fi

      - name: Upload ke GDrive
        if: always()
        run: |
          mkdir -p build_output
          mv rekaman_*.mp4 build_output/ 2>/dev/null || true
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          fi
