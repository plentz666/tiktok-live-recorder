name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python3 -m pip install -U requests

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Stream via Python Direct Parser
        run: |
          python3 recorder.py || true

      - name: Upload ke GDrive
        run: |
          ls -la
          if [ -f "rekaman_viplalicer.mp4" ] && [ -s "rekaman_viplalicer.mp4" ]; then
            rclone copy rekaman_viplalicer.mp4 gdrive:TikTok_Replays --progress
            echo "UPLOAD BERHASIL!"
          else
            echo "ERROR: File mp4 gagal dibuat."
            exit 1
          fi
