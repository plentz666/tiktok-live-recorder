name: 🔴 Rekam Tes TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yt-dlp & ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live cipuyyy221 (Direct URL + FFMPEG)
        continue-on-error: true
        run: |
          echo "Mengambil URL stream asli dari TikTok menggunakan yt-dlp..."
          
          # Mengambil direct link M3U8/FLV dari live TikTok
          STREAM_URL=$(yt-dlp -g "https://www.tiktok.com/@cipuyyy221/live" 2>/dev/null | head -n 1)
          
          if [ -z "$STREAM_URL" ]; then
            echo "Gagal mengambil URL stream! Pastikan akun sedang live."
            exit 1
          fi
          
          echo "URL berhasil didapat! Mulai merekam tepat 5 menit..."
          
          # Merekam menggunakan ffmpeg. Opsi -t 300 akan memastikan durasi video PAS 5 menit.
          ffmpeg -y -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
                 -t 300 \
                 -i "$STREAM_URL" \
                 -c copy -bsf:a aac_adtstoasc -movflags +faststart \
                 "rekaman_cipuyyy221_$(date +'%Y%m%d_%H%M%S').mp4" || true

      - name: Upload ke GDrive
        if: always()
        run: |
          mkdir -p build_output
          mv rekaman_*.mp4 build_output/ 2>/dev/null || true
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          fi
