name: 🧪 Tes Live TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python3 -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live TikTok (10 Menit)
        run: |
          TARGET_USER="argus.bkent"

          mkdir -p temp_record
          OUT_TS="temp_record/raw.ts"
          echo "Memulai perekaman untuk akun: @${TARGET_USER}..."

          yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
                 --referer "https://www.tiktok.com/" \
                 --hls-use-mpegts \
                 --retries 10 \
                 --fragment-retries 10 \
                 --downloader ffmpeg \
                 --downloader-args "ffmpeg:-t 600" \
                 "https://www.tiktok.com/@${TARGET_USER}/live" \
                 -o "$OUT_TS" || true

      - name: Remux ke MP4 Valid
        run: |
          mkdir -p build_output
          NOW=$(date +'%Y%m%d_%H%M%S')
          OUT_FILE="build_output/rekaman_argus.bkent_${NOW}.mp4"

          if [ -f "temp_record/raw.ts" ] && [ -s "temp_record/raw.ts" ]; then
            echo "Memperbaiki header stream & meremux ke MP4..."
            ffmpeg -y -i temp_record/raw.ts -c copy -bsf:a aac_adtstoasc -movflags +faststart "$OUT_FILE" || true
            rm -rf temp_record
          else
            echo "File mentah tidak ditemukan / streamer offline."
          fi

      - name: Upload ke GDrive
        if: always()
        run: |
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          fi
