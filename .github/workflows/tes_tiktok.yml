name: 🔴 Fix Final Streamlink Master

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies & Streamlink Latest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip ffmpeg rclone git
          sudo pip3 install --upgrade pip
          sudo pip3 install git+https://github.com/streamlink/streamlink.git

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live TikTok & Konversi
        run: |
          mkdir -p build_output
          echo "Mulai rekam live pakai Streamlink versi terbaru..."
          
          # Rekam 2 menit uji coba pakai URL lengkap
          timeout -s SIGINT 120s streamlink "https://www.tiktok.com/@ranngusion__/live" best -o "live_mentah.ts" || true

          # Proses convert ke MP4 yang valid
          if [ -f "live_mentah.ts" ]; then
            echo "Merender video ke format MP4..."
            ffmpeg -y -i live_mentah.ts -c:v libx264 -preset ultrafast -c:a aac -movflags +faststart "build_output/hasil_final_$(date +'%Y%m%d_%H%M%S').mp4"
            rm live_mentah.ts
          fi

      - name: Upload ke GDrive
        if: always()
        run: |
          find build_output/ -type f -size -1M -delete 2>/dev/null || true
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          else
            echo "❌ GAGAL: File kosong atau gagal terekam."
          fi
