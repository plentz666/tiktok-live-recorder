name: Rekam Cloud TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Streamlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live TikTok (Streamlink 1 Menit)
        run: |
          timeout 60s streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                 "https://www.tiktok.com/@viplalicer/live" best \
                 -o "raw_video.flv" || true

      - name: Convert ke MKV Playable GDrive
        run: |
          if [ -s "raw_video.flv" ]; then
            ffmpeg -y -i raw_video.flv -c copy rekaman_viplalicer.mkv
            rm -f raw_video.flv
          else
            echo "STREAMER OFFLINE / FILE FLV KOSONG"
          fi

      - name: Cek & Upload ke GDrive
        run: |
          ls -la
          if [ -f "rekaman_viplalicer.mkv" ]; then
            rclone copy rekaman_viplalicer.mkv gdrive:TikTok_Replays --progress
          else
            echo "ERROR: File rekaman_viplalicer.mkv tidak ada!"
            exit 1
          fi
