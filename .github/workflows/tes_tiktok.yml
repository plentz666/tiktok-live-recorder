name: 🧪 Tes Live TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Streamlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install --upgrade streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live betrixstelar (Tepat 10 Menit)
        run: |
          mkdir -p temp_record
          echo "Memulai perekaman betrixstelar (10 Menit)..."

          streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
                     --http-header "Referer=https://www.tiktok.com/" \
                     --stream-segment-threads 3 \
                     --stream-segment-timeout 10 \
                     --stream-segment-attempts 5 \
                     --hls-duration 00:10:00 \
                     "https://www.tiktok.com/@betrixstelar/live" best \
                     -o "temp_record/raw.ts" --force || true

      - name: Remux ke MP4 (Cek File Kosong)
        run: |
          mkdir -p build_output
          OUT_FILE="build_output/rekaman_betrixstelar_$(date +'%Y%m%d_%H%M%S').mp4"

          if [ -f "temp_record/raw.ts" ] && [ $(stat -c%s "temp_record/raw.ts" 2>/dev/null || echo 0) -gt 1000000 ]; then
            echo "File rekaman valid. Memperbaiki header stream & meremux ke MP4..."
            ffmpeg -y -i temp_record/raw.ts -c copy -bsf:a aac_adtstoasc -movflags +faststart "$OUT_FILE" || true
            rm -rf temp_record
          else
            echo "Rekaman gagal/kosong. Batal memproses."
            rm -rf temp_record
          fi

      - name: Upload ke GDrive
        if: always()
        run: |
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          fi
