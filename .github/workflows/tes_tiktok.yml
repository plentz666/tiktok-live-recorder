name: 🔴 Test Rekam Streamlink 2 Menit

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Streamlink & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip ffmpeg rclone
          sudo pip3 install --upgrade streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live Pakai Streamlink (2 Menit)
        run: |
          mkdir -p build_output
          echo "Mulai rekam live pakai Streamlink..."
          
          # Gunakan streamlink dengan timeout 120 detik (2 menit)
          timeout -s SIGINT 120s streamlink --twitch-disable-ads "tiktok.com/@ranngusion__/live" best -o "build_output/test_streamlink_$(date +'%Y%m%d_%H%M%S').mp4" || true

      - name: Upload ke GDrive
        if: always()
        run: |
          find build_output/ -type f -size -1M -delete 2>/dev/null || true
          
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            echo "Mengupload file hasil streamlink ke GDrive..."
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          else
            echo "❌ GAGAL: Tidak ada file valid yang diupload."
          fi
