name: 🧪 Tes Live TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Streamlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live TikTok (Streamlink)
        continue-on-error: true
        run: |
          # Streamlink rekam ke .ts dulu agar tahan dipotong timeout
          timeout 600s streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                 "https://www.tiktok.com/@argus.bkent/live" best \
                 -o "raw_stream.ts" --force || true

      - name: Perbaiki Header agar Playable di GDrive
        run: |
          if [ -f "raw_stream.ts" ] && [ -s "raw_stream.ts" ]; then
            echo "Memperbaiki header & menyusun ulang index MP4..."
            ffmpeg -y -i raw_stream.ts -c copy -bsf:a aac_adtstoasc -movflags +faststart rekaman_tes.mp4 || true
            rm -f raw_stream.ts
          fi

      - name: Cek & Upload ke GDrive
        if: always()
        run: |
          ls -la
          if [ -f "rekaman_tes.mp4" ]; then
            rclone copy rekaman_tes.mp4 gdrive:TikTok_Replays --progress
          fi
