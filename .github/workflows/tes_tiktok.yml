name: 🔴 Fix Final Rekam TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip ffmpeg rclone
          sudo pip3 install --upgrade streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam dan Fix Render MP4
        run: |
          mkdir -p build_output
          
          # Rekam 2 menit untuk uji coba kestabilan
          timeout -s SIGINT 120s streamlink "tiktok.com/@ranngusion__/live" best -o "live_mentah.ts" || true

          # Render ulang total dengan FFmpeg agar metadata video valid dan bisa diputar
          if [ -f "live_mentah.ts" ]; then
            ffmpeg -y -i live_mentah.ts -c:v libx264 -preset ultrafast -c:a aac -movflags +faststart "build_output/hasil_final_$(date +'%Y%m%d_%H%M%S').mp4"
            rm live_mentah.ts
          fi

      - name: Upload ke GDrive
        if: always()
        run: |
          find build_output/ -type f -size -1M -delete 2>/dev/null || true
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          else
            echo "❌ GAGAL: File kosong."
          fi
