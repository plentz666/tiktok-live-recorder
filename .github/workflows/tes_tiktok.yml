name: 🔴 Test Rekam 2 Menit TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yt-dlp & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Test Rekam 2 Menit (Format .ts)
        run: |
          mkdir -p build_output
          echo "Mulai test rekam 2 menit dengan .ts..."
          
          # 1. Rekam pakai timeout 120 detik (2 menit) ke format .ts yang aman
          timeout -s SIGINT 120s yt-dlp --hls-use-mpegts "https://www.tiktok.com/@ranngusion__/live" -o "live_mentah.ts" || true

          # 2. Konversi ke .mp4 agar valid dan bisa diputar di GDrive
          if [ -f "live_mentah.ts" ]; then
            echo "Mengonversi file .ts ke .mp4..."
            ffmpeg -y -i live_mentah.ts -c copy -movflags +faststart "build_output/test_2menit_$(date +'%Y%m%d_%H%M%S').mp4"
            rm live_mentah.ts
          fi

      - name: Upload ke GDrive
        if: always()
        run: |
          find build_output/ -type f -size -1M -delete 2>/dev/null || true
          
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            echo "Mengupload file test ke GDrive..."
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          else
            echo "❌ GAGAL: Tidak ada file valid yang diupload."
          fi
