name: 🔴 Rekam Tes TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Streamlink & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install --upgrade streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live cipuyyy221 (Piping Streamlink ke FFmpeg)
        continue-on-error: true
        run: |
          echo "Merekam menggunakan kombinasi Piping..."
          
          # Streamlink menyedot video dan mengeluarkan outputnya (--stdout)
          # FFmpeg menerima (pipe:0), merekam pas 5 menit (-t 300), dan memastikan format MP4 sempurna
          streamlink --stdout \
            --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://www.tiktok.com/@cipuyyy221/live" best | \
          ffmpeg -y -i pipe:0 -t 300 -c copy -movflags +faststart "rekaman_cipuyyy221_$(date +'%Y%m%d_%H%M%S').mp4" || true

      - name: Upload ke GDrive
        if: always()
        run: |
          mkdir -p build_output
          mv rekaman_*.mp4 build_output/ 2>/dev/null || true
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          fi
