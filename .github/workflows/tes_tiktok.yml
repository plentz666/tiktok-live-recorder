name: 🔴 Rekam Live TikTok Sampai Off

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yt-dlp & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live Sampai Off Live
        run: |
          mkdir -p build_output
          echo "Merekam live sampai akun off..."
          
          # Tanpa timeout! yt-dlp akan merekam secara natural sampai live selesai/off
          yt-dlp "https://www.tiktok.com/@ranngusion__/live" -o "build_output/rekaman_ranngusion___$(date +'%Y%m%d_%H%M%S').mp4" || true

      - name: Upload ke GDrive
        if: always()
        run: |
          find build_output/ -type f -size -1M -delete 2>/dev/null || true
          
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            echo "Mengupload file full durasi ke GDrive..."
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          else
            echo "❌ GAGAL: Tidak ada file valid yang diupload."
          fi
