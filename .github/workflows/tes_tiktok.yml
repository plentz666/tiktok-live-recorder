name: 🧪 Tes Live TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Streamlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install --upgrade streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live viplalicer (Tepat 10 Menit)
        continue-on-error: true
        run: |
          mkdir -p parts_viplalicer
          FILE_OUT="parts_viplalicer/part_001.ts"
          echo "Memulai perekaman viplalicer (Maksimal 10 Menit)..."

          timeout 10m streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
                     --http-header "Referer=https://www.tiktok.com/" \
                     --stream-segment-threads 2 \
                     --hls-live-restart \
                     "https://www.tiktok.com/@viplalicer/live" best \
                     -o "$FILE_OUT" --force || true

          if [ -f "$FILE_OUT" ] && [ -s "$FILE_OUT" ]; then
            printf "file '%s'\n" parts_viplalicer/*.ts > list_viplalicer.txt
            ffmpeg -f concat -safe 0 -i list_viplalicer.txt -c:v libx264 -preset ultrafast -crf 23 -c:a aac -b:a 128k -movflags +faststart "rekaman_viplalicer_$(date +'%Y%m%d_%H%M%S').mp4"
          fi

      - name: Upload ke GDrive
        if: always()
        run: |
          mkdir -p build_output
          mv rekaman_*.mp4 build_output/ 2>/dev/null || true
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          fi
