name: "🔴 Rekam Tes TikTok"

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apps & Streamlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install streamlink

      - name: Setup GDrive
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live akunliverinee (tes 2 menit)
        continue-on-error: true
        run: |
          timeout --signal=INT --kill-after=10 120 streamlink \
            --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://www.tiktok.com/@akunliverinee/live" best \
            -o "rekaman_akunliverinee_$(date +'%Y%m%d_%H%M%S').ts" --force || true

      - name: Perbaiki format ke MP4
        if: always()
        run: |
          shopt -s nullglob
          for f in rekaman_*.ts; do
            if [ -s "$f" ]; then
              ffmpeg -y -loglevel error -i "$f" -c copy -movflags +faststart "${f%.ts}.mp4" && rm "$f"
            else
              rm -f "$f"
            fi
          done
          ls -lh *.mp4 2>/dev/null || echo "Tidak ada file rekaman (akun mungkin tidak sedang live)"

      - name: Upload ke GDrive
        if: always()
        run: |
          rclone copy ./ gdrive:TikTok_Replays --include "*.mp4" --progress
