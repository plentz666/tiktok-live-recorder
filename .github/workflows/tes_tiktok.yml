name: 🔴 Rekam Tes TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Streamlink & Rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          pip install --upgrade streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live cipuyyy221
        run: |
          mkdir -p build_output
          echo "Merekam langsung ke MP4 menggunakan SIGINT agar file tidak rusak..."
          
          # -s SIGINT adalah kunci agar file MP4 ditutup dengan rapi dan bisa diputar.
          timeout -s SIGINT 300s streamlink --loglevel debug --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "https://www.tiktok.com/@cipuyyy221/live" best -o "build_output/rekaman_cipuyyy221_$(date +'%Y%m%d_%H%M%S').mp4" || true

      - name: Upload ke GDrive
        if: always()
        run: |
          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            echo "Mengupload file ke GDrive..."
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          else
            echo "Gagal merekam, tidak ada file untuk diupload."
          fi
