name: 🔴 Rekam Tes TikTok

on:
  workflow_dispatch:

jobs:
  record_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          pip install --upgrade streamlink

      - name: Setup GDrive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Rekam Live betrixstelar
        run: |
          mkdir -p build_output
          
          # Rekam langsung dan pastikan exit code ditangani
          timeout -s SIGINT 300s streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "https://www.tiktok.com/@betrixstelar/live" best -o "build_output/rekaman_betrixstelar.mp4" || true

      - name: Upload ke GDrive
        if: always()
        run: |
          # HAPUS MUTLAK FILE 0 KB ATAU DI BAWAH 1 MB (Mencegah file kosong ter-upload)
          find build_output/ -type f -size -1M -delete 2>/dev/null || true

          if [ -d "build_output" ] && [ "$(ls -A build_output)" ]; then
            echo "File valid ditemukan, mengupload ke GDrive..."
            rclone copy build_output/ gdrive:TikTok_Replays --progress
          else
            echo "❌ GAGAL: Streamer offline atau TikTok memblokir server GitHub (File 0 KB dibuang)."
          fi
